<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>DaiDai</title>
        <style>
            html,
            body,
            #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #02101c;
                touch-action: none;
            }
            #canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            #canvas:focus {
                outline: none;
            }
            #status {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                padding: 24px;
                color: #cfe9ff;
                background: radial-gradient(ellipse at center, #1a4a6a 0%, #062032 70%, #02101c 100%);
                font-family: monospace;
                opacity: 1;
                transition: opacity 240ms ease;
            }
            #status.loaded {
                opacity: 0;
                pointer-events: none;
            }
            #loading-worm {
                margin-bottom: 14px;
                font-size: 28px;
                animation: bob 900ms ease-in-out infinite alternate;
            }
            #loading-title {
                min-height: 22px;
                margin-bottom: 6px;
                color: #fff;
                font-size: 22px;
                letter-spacing: 2px;
                text-align: center;
            }
            #loading-sub {
                min-height: 10px;
                margin-bottom: 28px;
                font-size: 10px;
                opacity: 0.7;
            }
            #loading-bar-outer {
                width: 260px;
                max-width: 70vw;
                height: 14px;
                overflow: hidden;
                border: 2px solid #4cd1ff;
                border-radius: 8px;
                background: rgb(0 0 0 / 40%);
            }
            #loading-bar-inner {
                width: 0%;
                height: 100%;
                background: linear-gradient(90deg, #4cd1ff, #88f5ff);
                transition: width 100ms linear;
            }
            #loading-bar-inner.indeterminate {
                width: 35%;
                animation: indeterminate 1.1s ease-in-out infinite;
            }
            #loading-pct {
                margin-top: 10px;
                font-size: 10px;
            }
            #status-notice {
                display: none;
                max-width: 560px;
                margin-top: 24px;
                padding: 12px 16px;
                border: 1px solid #ff879e;
                border-radius: 8px;
                color: #ffe6eb;
                background: rgb(70 8 23 / 85%);
                line-height: 1.5;
                text-align: center;
                white-space: pre-wrap;
            }
            @keyframes bob {
                to {
                    transform: translateY(-7px) rotate(4deg);
                }
            }
            @keyframes indeterminate {
                0% {
                    transform: translateX(-120%);
                }
                100% {
                    transform: translateX(300%);
                }
            }
        </style>
        <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#02101c">
    </head>
    <body>
        <canvas id="canvas">Your browser does not support the canvas tag.</canvas>
        <noscript>Your browser does not support JavaScript.</noscript>
        <div id="status" role="status" aria-live="polite">
            <div id="loading-worm" aria-hidden="true">🐛</div>
            <div id="loading-title">呆呆虫之豆豆潭</div>
            <div id="loading-sub">Loading…</div>
            <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
            <div id="loading-pct">0%</div>
            <div id="status-notice"></div>
        </div>
        <script src="index.js"></script>
        <script>
            const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":27651276,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
            const GODOT_THREADS_ENABLED = false;
            const engine = new Engine(GODOT_CONFIG);
            const status = document.getElementById('status');
            const bar = document.getElementById('loading-bar-inner');
            const percentage = document.getElementById('loading-pct');
            const notice = document.getElementById('status-notice');

            function fail(error) {
                console.error(error);
                notice.textContent = error instanceof Error ? error.message : String(error);
                notice.style.display = 'block';
                bar.classList.remove('indeterminate');
                percentage.textContent = '!';
            }

            const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
            if (missing.length) {
                fail(`Missing browser features:\n${missing.join('\n')}`);
            } else {
                engine
                    .startGame({
                        canvas: document.getElementById('canvas'),
                        onProgress(current, total) {
                            if (current > 0 && total > 0) {
                                const progress = Math.min(1, current / total);
                                bar.classList.remove('indeterminate');
                                bar.style.width = `${Math.round(progress * 100)}%`;
                                percentage.textContent = `${Math.round(progress * 100)}%`;
                            } else {
                                bar.classList.add('indeterminate');
                                percentage.textContent = '…';
                            }
                        },
                    })
                    .then(() => {
                        bar.classList.remove('indeterminate');
                        bar.style.width = '100%';
                        percentage.textContent = '100%';
                        status.classList.add('loaded');
                        setTimeout(() => status.remove(), 260);
                    }, fail);
            }
        </script>
    </body>
</html>
