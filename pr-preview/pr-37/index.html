        <script>
            window.daidaiBuildReady = (() => {
                const currentBuild = '0e347a530f90e83c1e3a1e7ceab60a83d4ebc729';
                if (currentBuild.startsWith('__')) {
                    return Promise.resolve(true);
                }
                const versionUrl = new URL('build.json', window.location.href);
                versionUrl.searchParams.set('check', Date.now().toString());
                return fetch(versionUrl, { cache: 'no-store' })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`Build check failed: HTTP ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(({ build: latestBuild }) => {
                        if (!/^[0-9a-f]{40}$/.test(latestBuild) || latestBuild === currentBuild) {
                            return true;
                        }
                        const nextUrl = new URL(window.location.href);
                        if (nextUrl.searchParams.get('build') === latestBuild) {
                            console.warn('Latest preview files are still propagating.');
                            return true;
                        }
                        nextUrl.searchParams.set('build', latestBuild);
                        window.location.replace(nextUrl);
                        return false;
                    })
                    .catch((error) => {
                        console.warn('Unable to check for a newer preview build.', error);
                        return true;
                    });
            })();
        </script>
