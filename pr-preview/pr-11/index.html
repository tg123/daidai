<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>呆呆虫之豆豆潭</title>
        <link rel="icon" type="image/x-icon" href="./fav.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
        <!-- main.css is imported from src/main.ts so Vite handles it
             through its JS module pipeline (HMR + production bundling).
             A static <link> here would race with Vite's CSS module in
             dev (we saw unstyled flashes in iframed DevTools device
             mode). -->
        <!-- Critical inline CSS: shows the loading screen IMMEDIATELY
             (before main.css loads via JS module) and hides the rest of
             the unstyled HUD HTML so there's no flash. main.css then
             takes over with full styling. -->
        <style>
            html,
            body {
                margin: 0;
                background: #02101c;
                font-family: monospace;
            }
            body > *:not(#loading-screen) {
                visibility: hidden;
            }
            #loading-screen {
                position: fixed;
                inset: 0;
                z-index: 1000;
                background: radial-gradient(ellipse at center, #1a4a6a 0%, #062032 70%, #02101c 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: #cfe9ff;
            }
            #loading-worm {
                font-size: 28px;
                margin-bottom: 14px;
            }
            #loading-dots {
                font-size: 14px;
                color: #cfe9ff;
                letter-spacing: 2px;
                margin-bottom: 14px;
                opacity: 0.85;
            }
            /* Once JS has applied the right language, hide the
             * pre-i18n placeholder dots — the translated title +
             * sub take their place. */
            body.i18n-ready #loading-dots {
                display: none;
            }
            /* Hide language-bound text until JS applies i18n. Without
             * this, every non-zh-CN user sees a flash of Chinese
             * before the translated strings render. JS adds the
             * .i18n-ready class on <body> once applyI18nDOM() runs. */
            #loading-title,
            #loading-sub {
                visibility: hidden;
            }
            body.i18n-ready #loading-title,
            body.i18n-ready #loading-sub {
                visibility: visible;
            }
            #loading-title {
                font-size: 22px;
                letter-spacing: 2px;
                margin-bottom: 6px;
                color: #fff;
                min-height: 22px;
            }
            #loading-sub {
                font-size: 10px;
                opacity: 0.7;
                margin-bottom: 28px;
                min-height: 10px;
            }
            #loading-bar-outer {
                width: 260px;
                max-width: 70vw;
                height: 14px;
                border: 2px solid #4cd1ff;
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.4);
                overflow: hidden;
            }
            #loading-bar-inner {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, #4cd1ff, #88f5ff);
            }
            #loading-pct {
                margin-top: 10px;
                font-size: 10px;
            }
        </style>

                document.head.appendChild(s);
            }
        </script>
