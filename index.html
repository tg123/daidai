<!DOCTYPE html>

    <link rel="icon" type="image/x-icon" href="fav.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;

        }
        h1 {

        }
        #info-bar {
            display: flex;
            gap: 20px;
            padding: 6px 15px;

            font-family: 'Courier New', monospace;

<body>

        方向键/WASD 控制 | 空格暂停 | 回车重开 | 
        <span class="color-hint" style="background:#ff4444;"></span>红×5加速
