                    storeH: 'สิ่งที่เราจัดเก็บ',
                    storeP1:
                        'สถานะเกมทั้งหมด (คะแนนสูงสุด การตั้งค่า การตั้งค่าภาษา) จะถูกจัดเก็บ<strong>ไว้ในอุปกรณ์ของคุณเท่านั้น</strong> ในพื้นที่จัดเก็บแบบแยกส่วนของแอปเอง — <code>localStorage</code> ของเบราว์เซอร์สำหรับเวอร์ชันเว็บ และไดเรกทอรีข้อมูลส่วนตัวของแอปสำหรับเวอร์ชัน Android และโฟลเดอร์ข้อมูลแบบแพ็กเกจส่วนตัวของแอปสำหรับเวอร์ชัน Microsoft Store',
                    storeP2:
                        'ข้อมูลเหล่านี้จะไม่ออกจากอุปกรณ์ของคุณ การถอนการติดตั้งเกม (หรือการล้างข้อมูลเว็บไซต์) จะลบข้อมูลที่จัดเก็บไว้ทั้งหมดอย่างถาวร',
                    childrenH: 'ความเป็นส่วนตัวของเด็ก',
                    childrenP:
                        'เกมไม่เก็บข้อมูลจากใครทั้งสิ้น รวมถึงเด็กอายุต่ำกว่า 13 ปี ปลอดภัยสำหรับทุกวัย',
                    thirdH: 'บุคคลที่สาม',
                    thirdP:
                        'เกมไม่ใช้บริการ SDK เครื่องมือวิเคราะห์ เครือข่ายโฆษณา หรือตัวติดตามของบุคคลที่สามใด ๆ',
                    osH: 'โอเพนซอร์ส',
                    osP:
                        'เกมเป็นโอเพนซอร์สอย่างสมบูรณ์ภายใต้สัญญาอนุญาต MIT คุณสามารถตรวจสอบได้อย่างชัดเจนว่าเกมทำอะไร (และไม่ทำอะไร) ได้ที่ <a href="' +
                        GH +
                        '">' +
                        GH +
                        '</a>',
                    changesH: 'การเปลี่ยนแปลงนโยบายนี้',
                    changesP:
                        'หากนโยบายนี้มีการเปลี่ยนแปลง เวอร์ชันที่อัปเดตจะถูกเผยแพร่ที่ URL เดิมพร้อมวันที่ “อัปเดตล่าสุด” ใหม่',
                    contactH: 'ติดต่อ',
                    contactP:
                        'หากมีคำถามใด ๆ เกี่ยวกับความเป็นส่วนตัว โปรดเปิด issue ที่ <a href="' +
                        ISSUES +
                        '">' +
                        ISSUES +
                        '</a> หรือติดต่อผู้พัฒนา ' +
                        DEV +
                        ' ทางอีเมลที่ระบุไว้ใน <a href="' +
                        PLAY +
                        '">หน้า Google Play</a> หรือ Microsoft Store',
                },
            };

            var ORDER = [
                'en-us',
                'zh-cn',
                'zh-tw',
                'ja-jp',
                'ko-kr',
                'es-es',
                'fr-fr',
                'it-it',
                'de-de',
                'pt-br',
                'pl-pl',
                'ru-ru',
                'th-th',
            ];

            function render(code) {
                var d = I18N[code] || I18N['en-us'];
                document.documentElement.lang = d.htmlLang;
                document.title = d.h1 + ' — ' + d.title;
                var html = '';
                html += '<h1>' + d.h1 + ' — ' + d.title + '</h1>';
                html += '<p class="updated">' + d.updated + '</p>';
                html += '<p class="master-note">' + d.master + '</p>';
                html += '<p>' + d.intro + '</p>';
                html += '<h2>' + d.collectH + '</h2><p>' + d.collectP + '</p>';
                html += '<h2>' + d.transmitH + '</h2><p>' + d.transmitP + '</p>';
                html += '<h2>' + d.storeH + '</h2><p>' + d.storeP1 + '</p><p>' + d.storeP2 + '</p>';
                html += '<h2>' + d.childrenH + '</h2><p>' + d.childrenP + '</p>';
                html += '<h2>' + d.thirdH + '</h2><p>' + d.thirdP + '</p>';
                html += '<h2>' + d.osH + '</h2><p>' + d.osP + '</p>';
                html += '<h2>' + d.changesH + '</h2><p>' + d.changesP + '</p>';
                html += '<h2>' + d.contactH + '</h2><p>' + d.contactP + '</p>';
                document.getElementById('content').innerHTML = html;
            }

            function pickLang() {
                var navs = navigator.languages || [navigator.language || 'en'];
                for (var i = 0; i < navs.length; i++) {
                    var lc = String(navs[i] || '').toLowerCase();
                    if (
                        lc === 'zh-tw' ||
                        lc === 'zh-hk' ||
                        lc === 'zh-mo' ||
                        lc.indexOf('zh-hant') === 0
                    )
                        return 'zh-tw';
                    if (lc.indexOf('zh') === 0) return 'zh-cn';
                    if (lc.indexOf('en') === 0) return 'en-us';
                    if (lc.indexOf('ja') === 0) return 'ja-jp';
                    if (lc.indexOf('ko') === 0) return 'ko-kr';
                    if (lc.indexOf('es') === 0) return 'es-es';
                    if (lc.indexOf('fr') === 0) return 'fr-fr';
                    if (lc.indexOf('it') === 0) return 'it-it';
                    if (lc.indexOf('de') === 0) return 'de-de';
                    if (lc.indexOf('pt') === 0) return 'pt-br';
                    if (lc.indexOf('pl') === 0) return 'pl-pl';
                    if (lc.indexOf('ru') === 0) return 'ru-ru';
                    if (lc.indexOf('th') === 0) return 'th-th';
                }
                return 'en-us';
            }

            (function init() {
                var sel = document.getElementById('langSwitch');
                for (var i = 0; i < ORDER.length; i++) {
                    var code = ORDER[i];
                    var opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = I18N[code].name;
                    sel.appendChild(opt);
                }
                var initial = pickLang();
                sel.value = initial;
                render(initial);
                sel.addEventListener('change', function () {
                    render(sel.value);
                });
            })();
        </script>
    </body>
</html>
