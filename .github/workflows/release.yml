name: Release

# Two-phase release flow:
#   1. Pushes to main refresh the next patch release as a draft.
#   2. Publishing the draft exports native Godot builds and attaches them.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

# Kept out of run scripts so tag text is passed as data, never evaluated as code.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  draft:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next semver
        id: repo-semver
        uses: lhstrh/action-repo-semver@v1.2.1
        with:
          bump: patch

      - name: Refresh draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.repo-semver.outputs.bump }}"
          existing=$(gh release list --json tagName,isDraft \
            --jq ".[] | select(.isDraft and .tagName==\"$tag\") | .tagName")
          if [ -n "$existing" ]; then
            gh release delete "$existing" --yes
          fi
          gh release create -d --generate-notes "$tag" \
            --notes "Native Godot release. The Xbox edition is built through the private GDK pipeline and is no longer a PWA."

  build:
    if: github.event_name == 'release'
    name: Godot ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            preset: Windows Desktop
            executable: DaiDai-windows-x64.exe
            artifact: DaiDai-windows-x64.zip
          - label: Windows ARM64
            platform: windows-latest
            preset: Windows arm64
            executable: DaiDai-windows-arm64.exe
            artifact: DaiDai-windows-arm64.zip
          - label: macOS ARM64
            platform: macos-latest
            preset: macOS Universal
            artifact: DaiDai-macos-arm64.zip
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Set native release version
        shell: pwsh
        run: ./scripts/set_release_version.ps1 -Version $env:RELEASE_TAG

      - name: Import Godot resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--editor", "--path", "godot", "--quit") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot resource import failed with exit code $($process.ExitCode)."
          }

      - name: Import Godot resources
        if: runner.os == 'macOS'
        shell: bash
        run: '"$GODOT" --headless --editor --path godot --quit'

      - name: Export Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $PWD "${{ matrix.executable }}"
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $env:GODOT
          $startInfo.UseShellExecute = $false
          foreach ($argument in @("--headless", "--path", "godot", "--export-release", "${{ matrix.preset }}", $output)) {
            [void] $startInfo.ArgumentList.Add($argument)
          }
          $process = [Diagnostics.Process]::Start($startInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Godot export failed with exit code $($process.ExitCode)."
          }
          Compress-Archive `
            -LiteralPath $output `
            -DestinationPath (Join-Path $PWD "${{ matrix.artifact }}") `
            -CompressionLevel Optimal

      - name: Export macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source_zip="$RUNNER_TEMP/DaiDai-macos-universal.zip"
          "$GODOT" --headless --path godot --export-release "${{ matrix.preset }}" "$source_zip"
          bash scripts/thin_macos_arm64.sh "$source_zip" "$PWD/${{ matrix.artifact }}"

      - name: Verify release artifact
        shell: pwsh
        run: |
          $artifact = Get-Item "${{ matrix.artifact }}"
          if ($artifact.Length -lt 1MB) {
            throw "Exported artifact is unexpectedly small."
          }
          Write-Host "${{ matrix.artifact }}: $($artifact.Length) bytes"

      - name: Verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path "${{ matrix.artifact }}").Path
          )
          try {
            $entries = @($archive.Entries | Select-Object -ExpandProperty FullName)
            if ($entries.Count -ne 1 -or $entries[0] -ne "${{ matrix.executable }}") {
              throw "Unexpected Windows archive contents: $($entries -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload release artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.artifact }}" --clobber

  microsoft-store:
    if: github.event_name == 'release'
    name: Microsoft Store MSIX
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Partner Center > Product identity > Package/Identity/Publisher. Accepted as a
      # variable or a secret; the steps are skipped until it is configured.
      MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER || secrets.MSSTORE_PUBLISHER }}
      MSSTORE_FLIGHT_ID: ${{ vars.MSSTORE_FLIGHT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

    steps:
      - name: Report configuration
        if: env.MSSTORE_PUBLISHER == ''
        run: echo "::notice::MSSTORE_PUBLISHER is not set; skipping the Microsoft Store MSIX."

      - uses: actions/checkout@v5
        if: env.MSSTORE_PUBLISHER != ''

      - name: Download native Windows builds
        if: env.MSSTORE_PUBLISHER != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download $env:RELEASE_TAG -p "DaiDai-windows-*.zip" -D windows
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed with exit code $LASTEXITCODE." }
          Get-ChildItem windows -Filter *.zip | ForEach-Object {
            Expand-Archive -LiteralPath $_.FullName -DestinationPath windows -Force
          }

      - name: Build MSIX bundle
        if: env.MSSTORE_PUBLISHER != ''
        shell: pwsh
        run: |
          ./scripts/package_msix.ps1 `
            -Version $env:RELEASE_TAG `
            -Publisher $env:MSSTORE_PUBLISHER `
            -X64Executable windows/DaiDai-windows-x64.exe `
            -Arm64Executable windows/DaiDai-windows-arm64.exe `
            -OutputPath DaiDai-windows.msixbundle

      - name: Upload MSIX bundle
        if: env.MSSTORE_PUBLISHER != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" DaiDai-windows.msixbundle --clobber

      - name: Set up Microsoft Store CLI
        if: env.MSSTORE_PUBLISHER != '' && env.PARTNER_CENTER_CLIENT_SECRET != '' && env.MSSTORE_FLIGHT_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.4

      # Mirrors Google Play's internal track: releases go only to a package flight.
      # Draft/production submissions replace any pending Partner Center submission,
      # so they are left to the manual Microsoft Store Upload workflow.
      - name: Submit to Microsoft Store package flight
        if: env.MSSTORE_PUBLISHER != '' && env.PARTNER_CENTER_CLIENT_SECRET != '' && env.MSSTORE_FLIGHT_ID != ''
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
        run: |
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with exit code $LASTEXITCODE." }
          ./scripts/publish_msstore.ps1 `
            -Package DaiDai-windows.msixbundle `
            -Target flight `
            -FlightId $env:MSSTORE_FLIGHT_ID

  android:
    if: github.event_name == 'release'
    name: Godot Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package was removed from the SDK repository.
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_ALIAS" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS, and ANDROID_KEYSTORE_PASSWORD secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"

      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Set native release version
        shell: pwsh
        run: ./scripts/set_release_version.ps1 -Version $env:RELEASE_TAG

      - name: Set Android version code
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version_name%%-*}"
          # Semver-derived code, matching the earlier Tauri scheme (0.1.0 -> 1000).
          version_code=$(( major * 1000000 + minor * 1000 + patch ))
          sed -i "s|^version/code=.*|version/code=$version_code|" godot/export_presets.cfg

      - name: Import Godot resources
        run: '"$GODOT" --headless --editor --path godot --quit'

      - name: Export signed Android APK and AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/android-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          "$GODOT" --headless --path godot --export-release "Android APK" "$PWD/DaiDai-android-arm64.apk"
          "$GODOT" --headless --path godot --install-android-build-template --export-release "Android AAB" "$PWD/DaiDai-android-arm64.aab"

      - name: Verify Android artifacts
        run: |
          test -s DaiDai-android-arm64.apk
          test -s DaiDai-android-arm64.aab
          unzip -l DaiDai-android-arm64.apk | grep -q 'lib/arm64-v8a/'
          unzip -l DaiDai-android-arm64.aab | grep -q 'base/lib/arm64-v8a/'

      - name: Upload Android release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            DaiDai-android-arm64.apk \
            DaiDai-android-arm64.aab \
            --clobber

      - name: Publish to Google Play internal testing
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.tg123.daidai
          releaseFiles: DaiDai-android-arm64.aab
          releaseName: ${{ github.event.release.tag_name }}
          tracks: internal
          status: completed
