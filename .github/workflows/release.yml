name: Release

# Two-phase, manual-gate release flow (mirrors github.com/tg123/bbb):
#
#   1. push to main  →  `draft` job creates/refreshes a *draft* release at
#      the next patch version, using auto-generated release notes. The draft
#      is never auto-published; you click "Publish release" in the GitHub UI
#      when you're ready.
#   2. on release published  →  `build` job runs `tauri build` on a
#      win/mac matrix and uploads ONLY the raw, no-installer executables:
#        - Windows:  DaiDai-windows-x64.exe   (single .exe, no MSI/NSIS)
#        - macOS:    DaiDai-macos-universal.zip (zipped .app, no DMG)
#      Linux is intentionally not built.

on:
  push:
    branches: [main]
  release:
    types: [published, released]

permissions:
  contents: write

jobs:
  draft:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next semver
        id: repo-semver
        uses: lhstrh/action-repo-semver@v1.2.1
        with:
          bump: patch
      - name: Refresh draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.repo-semver.outputs.bump }}"
          # Delete any existing draft at this tag so we can re-create with fresh notes.
          # `gh release list | grep` exits non-zero on no-match (common on first run);
          # use `--json` + `jq` instead so the step doesn't fail before `release create`.
          existing=$(gh release list --json tagName,isDraft \
            --jq ".[] | select(.isDraft and .tagName==\"$tag\") | .tagName")
          if [ -n "$existing" ]; then
            gh release delete "$existing" --yes
          fi
          gh release create -d --generate-notes "$tag"

  build:
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            arch: universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      # macOS: build a universal .app (no DMG installer). The .app is a
      # bundle directory; zip it so users get a single download that
      # extracts to a drag-to-Applications artifact.
      - name: Build macOS .app
        if: matrix.platform == 'macos-latest'
        env:
          DAIDAI_BUILD_SHA: ${{ github.sha }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app

      - name: Zip and upload macOS .app
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          # productName in src-tauri/tauri.conf.json -> DaiDai.app
          app="DaiDai.app"
          if [ ! -d "$app" ]; then
            echo "::error::Expected $app in $(pwd); got: $(ls)"
            exit 1
          fi
          out="DaiDai-macos-${{ matrix.arch }}.zip"
          # ditto preserves macOS metadata (resource forks, code signatures)
          # that plain `zip` would strip, so the extracted .app launches
          # cleanly without "is damaged" Gatekeeper errors.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          gh release upload "${{ github.event.release.tag_name }}" "$out" --clobber

      # Windows: build the raw .exe only (--bundles none skips NSIS/MSI).
      # The resulting executable depends only on the system-provided
      # WebView2 runtime (preinstalled on Windows 11 and on Windows 10
      # via Edge updates), so it ships as a true single-file download.
      # We build x64 + arm64 in separate matrix jobs so Surface / Copilot+
      # PC users get a native binary instead of x64-on-arm emulation.
      - name: Build Windows .exe
        if: matrix.platform == 'windows-latest'
        env:
          DAIDAI_BUILD_SHA: ${{ github.sha }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles none

      - name: Upload Windows .exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # mainBinaryName in src-tauri/tauri.conf.json -> daidai.exe
          $src = "src-tauri\target\${{ matrix.target }}\release\daidai.exe"
          if (-not (Test-Path $src)) { throw "Expected $src to exist after tauri build" }
          $out = "DaiDai-windows-${{ matrix.arch }}.exe"
          Copy-Item $src $out
          gh release upload "${{ github.event.release.tag_name }}" $out --clobber
