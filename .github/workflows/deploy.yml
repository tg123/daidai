name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  build:
    name: build
    # Only build when we actually need a dist artifact: pushes to main
    # (for gh-pages deploy) and non-closed PR events from same-repo
    # branches (for PR previews). Fork PRs and PR-close events skip.
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request'
        && github.event.action != 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - name: Build
        # See ci.yml `build` step for rationale on DAIDAI_BUILD_SHA.
        env:
          DAIDAI_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-deploy
          path: dist
          retention-days: 1

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: dist-deploy
          path: dist
      - name: Deploy dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
          force: false

  itch:
    name: publish to itch.io
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: itch-publish
      cancel-in-progress: false
    env:
      # Pin butler to a specific version + checksum so deployments are
      # reproducible and we don't silently pick up upstream changes.
      # SHA256 was verified once locally against broth.itch.zone before
      # being committed here; update both lines together when bumping.
      BUTLER_VERSION: '15.27.0'
      BUTLER_SHA256: 'b9f0d6eef33036031cafaf59939d9f3bc724e2b674c510d4a9cf8a9f1008e299'
    steps:
      - name: Check BUTLER_API_KEY is configured
        id: gate
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::notice::BUTLER_API_KEY secret is not set; skipping itch.io publish. Add the secret at https://github.com/${{ github.repository }}/settings/secrets/actions to enable."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/download-artifact@v4.1.3
        with:
          name: dist-deploy
          path: dist
      - name: Install butler (pinned + SHA256 verified)
        if: steps.gate.outputs.skip != '1'
        run: |
          cd "$RUNNER_TEMP"
          curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL \
            -o butler.zip \
            "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  butler.zip" | sha256sum --check --status
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      - name: Push dist to farmer1992/daidai:html
        if: steps.gate.outputs.skip != '1'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          "$RUNNER_TEMP/butler/butler" push \
            dist farmer1992/daidai:html \
            --userversion "$(echo '${{ github.sha }}' | cut -c1-12)"

  pr-preview:
    name: deploy PR preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: dist-deploy
          path: dist
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  pr-preview-cleanup:
    name: remove PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
