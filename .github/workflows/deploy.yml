name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  build:
    name: build
    # Only build when we actually need a dist artifact: pushes to main
    # (for gh-pages deploy) and non-closed PR events from same-repo
    # branches (for PR previews). Fork PRs and PR-close events skip.
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request'
        && github.event.action != 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Import Godot resources
        run: '"$GODOT" --headless --editor --path godot --quit'
      - name: Export Godot Web build
        run: |
          mkdir -p dist
          export_preset="Web"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export_preset="Web Preview"
          fi
          "$GODOT" --headless --path godot --export-release "$export_preset" "$PWD/dist/index.html"
          asset_base="index-${GITHUB_SHA}"
          for suffix in js wasm pck audio.worklet.js audio.position.worklet.js; do
            escaped_suffix="${suffix//./\\.}"
            mv "dist/index.${suffix}" "dist/${asset_base}.${suffix}"
            sed -i "s/index\\.${escaped_suffix}/${asset_base}.${suffix}/g" dist/index.html
            if [ -f dist/index.service.worker.js ]; then
              sed -i "s/index\\.${escaped_suffix}/${asset_base}.${suffix}/g" dist/index.service.worker.js
            fi
          done
          sed -i "s/\"executable\":\"index\"/\"executable\":\"${asset_base}\"/g" dist/index.html
          sed -i "s/__DAIDAI_BUILD_ID__/${GITHUB_SHA}/g" dist/index.html
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > dist/build.json
          if [ -f dist/index.service.worker.js ]; then
            cat >> dist/index.service.worker.js <<'EOF'
          /* DAIDAI_AUTO_UPDATE */
          self.addEventListener('install', (event) => {
            event.waitUntil(self.skipWaiting());
          });
          self.addEventListener('activate', (event) => {
            event.waitUntil(
              self.clients.claim().then(() => self.clients.matchAll()).then((clients) => {
                const scopePath = new URL(self.registration.scope).pathname;
                return Promise.all(
                  clients
                    .filter((client) => {
                      const path = new URL(client.url).pathname;
                      return path === scopePath || path === `${scopePath}index.html`;
                    })
                    .map((client) => client.navigate(client.url)),
                );
              }),
            );
          });
          EOF
          fi
          cp public/privacy.html public/PRIVACY.md public/fav.ico dist/
          touch dist/.nojekyll
      - name: Verify Web artifact
        run: |
          asset_base="index-${GITHUB_SHA}"
          test -s dist/index.html
          test -s "dist/${asset_base}.js"
          test -s "dist/${asset_base}.wasm"
          test -s "dist/${asset_base}.pck"
          test -s "dist/${asset_base}.audio.worklet.js"
          test -s "dist/${asset_base}.audio.position.worklet.js"
          test ! -e dist/index.js
          test ! -e dist/index.wasm
          test ! -e dist/index.pck
          test ! -e dist/index.audio.worklet.js
          test ! -e dist/index.audio.position.worklet.js
          test -s dist/privacy.html
          test -s dist/build.json
          grep -q "$asset_base" dist/index.html
          grep -q "$GITHUB_SHA" dist/index.html
          grep -q "$GITHUB_SHA" dist/build.json
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test -s dist/index.service.worker.js
            grep -q "$asset_base" dist/index.service.worker.js
            grep -q "DAIDAI_AUTO_UPDATE" dist/index.service.worker.js
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-deploy
          path: dist
          retention-days: 1

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: dist-deploy
          path: dist
      - name: Deploy dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
          force: false

  itch:
    name: publish to itch.io
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: itch-publish
      cancel-in-progress: false
    env:
      # Pin butler to a specific version + checksum so deployments are
      # reproducible and we don't silently pick up upstream changes.
      # SHA256 was verified once locally against broth.itch.zone before
      # being committed here; update both lines together when bumping.
      BUTLER_VERSION: '15.27.0'
      BUTLER_SHA256: 'b9f0d6eef33036031cafaf59939d9f3bc724e2b674c510d4a9cf8a9f1008e299'
    steps:
      - name: Check BUTLER_API_KEY is configured
        id: gate
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::notice::BUTLER_API_KEY secret is not set; skipping itch.io publish. Add the secret at https://github.com/${{ github.repository }}/settings/secrets/actions to enable."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/download-artifact@v4.1.3
        with:
          name: dist-deploy
          path: dist
      - name: Install butler (pinned + SHA256 verified)
        if: steps.gate.outputs.skip != '1'
        run: |
          cd "$RUNNER_TEMP"
          curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL \
            -o butler.zip \
            "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  butler.zip" | sha256sum --check --status
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      - name: Push dist to farmer1992/daidai:html
        if: steps.gate.outputs.skip != '1'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          "$RUNNER_TEMP/butler/butler" push \
            dist farmer1992/daidai:html \
            --userversion "$(echo '${{ github.sha }}' | cut -c1-12)"

  pr-preview:
    name: deploy PR preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: dist-deploy
          path: dist
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  pr-preview-cleanup:
    name: remove PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
