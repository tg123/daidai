name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  # Keep this context name until the main ruleset is migrated from the retired
  # quality checks. The job itself is entirely Godot-based.
  quality:
    name: typecheck + lint + format + unit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import Godot resources
        run: '"$GODOT" --headless --editor --path godot --quit'
      - name: Run Godot tests
        run: |
          "$GODOT" --headless --path godot --script res://tests/rules_test.gd
          "$GODOT" --headless --path godot --script res://tests/gameplay_test.gd
          "$GODOT" --headless --path godot --script res://tests/integration_test.gd
          "$GODOT" --headless --path godot --script res://tests/regression_test.gd
          "$GODOT" --headless --path godot --script res://tests/performance_test.gd
      - name: Run scene smoke test
        run: '"$GODOT" --headless --path godot --quit-after 120'
