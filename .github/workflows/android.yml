name: Android

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Godot Android ARM64 APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/android-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000

      - name: Import Godot resources
        run: '"$GODOT" --headless --editor --path godot --quit'

      - name: Export debug APK and AAB
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/android-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          "$GODOT" --headless --path godot --export-debug "Android APK" "$PWD/DaiDai-android-arm64-debug.apk"
          "$GODOT" --headless --path godot --install-android-build-template --export-debug "Android AAB" "$PWD/DaiDai-android-arm64-debug.aab"

      - name: Verify Android artifacts
        run: |
          test -s DaiDai-android-arm64-debug.apk
          test -s DaiDai-android-arm64-debug.aab
          unzip -l DaiDai-android-arm64-debug.apk | grep -q 'lib/arm64-v8a/'
          unzip -l DaiDai-android-arm64-debug.aab | grep -q 'base/lib/arm64-v8a/'
          if unzip -l DaiDai-android-arm64-debug.apk | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::APK contains an unexpected non-ARM64 ABI."
            exit 1
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaiDai-Android-ARM64-debug
          path: |
            DaiDai-android-arm64-debug.apk
            DaiDai-android-arm64-debug.aab
          retention-days: 7
          if-no-files-found: error
