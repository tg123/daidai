name: Godot

on:
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
  push:
    branches:
      - main
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    name: Test and export Web + Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Import Godot resources
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--editor", "--path", "godot", "--quit") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot resource import failed with exit code $($process.ExitCode)."
          }

      - name: Run rules tests
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--path", "godot", "--script", "res://tests/rules_test.gd") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot rules tests failed with exit code $($process.ExitCode)."
          }

      - name: Run gameplay tests
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--path", "godot", "--script", "res://tests/gameplay_test.gd") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot gameplay tests failed with exit code $($process.ExitCode)."
          }

      - name: Run integration tests
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--path", "godot", "--script", "res://tests/integration_test.gd") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot integration tests failed with exit code $($process.ExitCode)."
          }

      - name: Run migrated E2E regressions
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--path", "godot", "--script", "res://tests/regression_test.gd") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot migrated E2E regressions failed with exit code $($process.ExitCode)."
          }

      - name: Run performance tests
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--path", "godot", "--script", "res://tests/performance_test.gd") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot performance tests failed with exit code $($process.ExitCode)."
          }

      - name: Run scene smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:GODOT `
            -ArgumentList @("--headless", "--path", "godot", "--quit-after", "120") `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Godot scene smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Export Web release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force godot/exports/web | Out-Null
          $output = Join-Path $PWD "godot/exports/web/index.html"
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $env:GODOT
          $startInfo.UseShellExecute = $false
          foreach ($argument in @("--headless", "--path", "godot", "--export-release", "Web", $output)) {
            [void] $startInfo.ArgumentList.Add($argument)
          }
          $process = [Diagnostics.Process]::Start($startInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Godot Web export failed with exit code $($process.ExitCode)."
          }

      - name: Verify Web artifact
        shell: pwsh
        run: |
          foreach ($path in @(
            "godot/exports/web/index.html",
            "godot/exports/web/index.js",
            "godot/exports/web/index.wasm",
            "godot/exports/web/index.pck",
            "godot/exports/web/index.manifest.json",
            "godot/exports/web/index.icon.png",
            "godot/exports/web/index.apple-touch-icon.png"
          )) {
            $artifact = Get-Item $path
            if ($artifact.Length -eq 0) {
              throw "$path is empty."
            }
            Write-Host "${path}: $($artifact.Length) bytes"
          }

      - name: Upload Web release
        uses: actions/upload-artifact@v4
        with:
          name: DaiDai-Web
          path: godot/exports/web
          if-no-files-found: error

      - name: Export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force godot/exports | Out-Null
          $output = Join-Path $PWD "godot/exports/DaiDai.exe"
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $env:GODOT
          $startInfo.UseShellExecute = $false
          foreach ($argument in @("--headless", "--path", "godot", "--export-release", "Windows Desktop", $output)) {
            [void] $startInfo.ArgumentList.Add($argument)
          }
          $process = [Diagnostics.Process]::Start($startInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Godot Windows export failed with exit code $($process.ExitCode)."
          }

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifact = Get-Item godot/exports/DaiDai.exe
          if ($artifact.Length -lt 1MB) {
            throw "Exported executable is unexpectedly small."
          }
          Write-Host "DaiDai.exe: $($artifact.Length) bytes"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: DaiDai-Windows-x86_64
          path: godot/exports/DaiDai.exe
          if-no-files-found: error

  additional-exports:
    name: Export ${{ matrix.label }}
    needs: test-and-export
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows ARM64
            platform: windows-latest
            preset: Windows arm64
            artifact: DaiDai-windows-arm64.exe
          - label: macOS ARM64
            platform: macos-latest
            preset: macOS Universal
            artifact: DaiDai-macos-arm64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Export Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $PWD "${{ matrix.artifact }}"
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $env:GODOT
          $startInfo.UseShellExecute = $false
          foreach ($argument in @("--headless", "--path", "godot", "--export-release", "${{ matrix.preset }}", $output)) {
            [void] $startInfo.ArgumentList.Add($argument)
          }
          $process = [Diagnostics.Process]::Start($startInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Godot export failed with exit code $($process.ExitCode)."
          }

      - name: Export macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source_zip="$RUNNER_TEMP/DaiDai-macos-universal.zip"
          "$GODOT" --headless --path godot --export-release "${{ matrix.preset }}" "$source_zip"
          bash scripts/thin_macos_arm64.sh "$source_zip" "$PWD/${{ matrix.artifact }}"

      - name: Verify artifact
        shell: pwsh
        run: |
          $artifact = Get-Item "${{ matrix.artifact }}"
          if ($artifact.Length -lt 1MB) {
            throw "Exported artifact is unexpectedly small."
          }
          Write-Host "${{ matrix.artifact }}: $($artifact.Length) bytes"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
