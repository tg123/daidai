name: e2e

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  # Keep this context name until the main ruleset is migrated from the retired
  # browser suite. It now validates the canonical Godot Web distribution.
  test:
    name: dist
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Import Godot resources
        run: '"$GODOT" --headless --editor --path godot --quit'
      - name: Export Web distribution
        run: |
          mkdir -p dist
          "$GODOT" --headless --path godot --export-release "Web Preview" "$PWD/dist/index.html"
      - name: Verify Web distribution
        run: |
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm
          test -s dist/index.pck
