name: e2e

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    name: dist
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        # See ci.yml `build` step for rationale on DAIDAI_BUILD_SHA.
        env:
          DAIDAI_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Test
        env:
          TEST_DIST_SKIP_BUILD: '1'
        run: npm run test:dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-dist
          path: |
            playwright-report/
            test-results/
          retention-days: 7
